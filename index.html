<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>習慣トラッカー</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#FF6B4A" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="習慣トラッカー" />
<link rel="apple-touch-icon" href="./icon-180.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #FFFBF5; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  input[type="text"] { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback } = React;
const HABITS_KEY = "habit-list";
const COMPLETIONS_KEY = "habit-completions";
const EMOJIS = ["💪", "📖", "🧘", "🏃", "💧", "🎯", "🧠", "🎨", "🌱", "😴"];
const COLORS = ["#FF6B4A", "#2EC4B6", "#FFC145", "#6C5CE7", "#00B894"];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function dateStrOffset(offsetDays) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function computeStreak(doneDates) {
  const set = new Set(doneDates);
  let streak = 0;
  let cursor = 0;
  if (!set.has(dateStrOffset(0))) {
    cursor = -1;
  }
  while (set.has(dateStrOffset(cursor))) {
    streak++;
    cursor--;
  }
  return streak;
}

function last7Days() {
  const days = [];
  for (let i = -6; i <= 0; i++) {
    days.push(dateStrOffset(i));
  }
  return days;
}

function HabitCard({ habit, doneDates, onToggleToday, onDelete }) {
  const streak = computeStreak(doneDates);
  const doneSet = new Set(doneDates);
  const doneToday = doneSet.has(todayStr());
  const week = last7Days();
  const weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];

  return (
    <div style={{
      background: "#FFFFFF", borderRadius: 18, padding: "16px 18px",
      boxShadow: "0 2px 10px rgba(43,43,43,0.06)", marginBottom: 14,
      border: doneToday ? `2px solid ${habit.color}` : "2px solid transparent",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 26 }}>{habit.emoji}</span>
          <div>
            <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "#2B2B2B", fontFamily: "'Baloo 2', sans-serif" }}>{habit.name}</p>
            {streak > 0 && (
              <p style={{ margin: "2px 0 0", fontSize: 12, color: "#FF6B4A", fontWeight: 600 }}>
                🔥 {streak}日連続
              </p>
            )}
          </div>
        </div>
        <button
          onClick={() => onDelete(habit.id)}
          aria-label="この習慣を削除"
          style={{ background: "transparent", border: "none", color: "#C9C4BC", fontSize: 12, cursor: "pointer", padding: 4 }}
        >
          削除
        </button>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
        {week.map((d) => {
          const isToday = d === todayStr();
          const done = doneSet.has(d);
          const dow = new Date(d + "T00:00:00").getDay();
          return (
            <div key={d} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 10, color: "#B8B2A8" }}>{weekdayLabels[dow]}</span>
              <div style={{
                width: 26, height: 26, borderRadius: "50%",
                background: done ? habit.color : "#F2EFE9",
                border: isToday ? `2px solid ${habit.color}` : "2px solid transparent",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 12, color: done ? "#fff" : "#C9C4BC",
              }}>
                {done ? "✓" : ""}
              </div>
            </div>
          );
        })}
      </div>

      <button
        onClick={() => onToggleToday(habit.id)}
        style={{
          width: "100%", padding: "12px 0", borderRadius: 12, border: "none",
          background: doneToday ? "#F2EFE9" : habit.color,
          color: doneToday ? "#8A8478" : "#fff",
          fontSize: 14, fontWeight: 700, cursor: "pointer",
          fontFamily: "'Baloo 2', sans-serif",
        }}
      >
        {doneToday ? "✓ 今日は完了しました" : "今日のチェックを付ける"}
      </button>
    </div>
  );
}

function HabitTracker() {
  const [habits, setHabits] = useState([]);
  const [completions, setCompletions] = useState({});
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState("");
  const [newEmoji, setNewEmoji] = useState(EMOJIS[0]);
  const [showAdd, setShowAdd] = useState(false);
  const [error, setError] = useState("");

  const load = useCallback(() => {
    setLoading(true);
    try {
      const h = JSON.parse(localStorage.getItem(HABITS_KEY) || "[]");
      const c = JSON.parse(localStorage.getItem(COMPLETIONS_KEY) || "{}");
      setHabits(Array.isArray(h) ? h : []);
      setCompletions(c && typeof c === "object" ? c : {});
    } catch (e) {
      setHabits([]);
      setCompletions({});
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  function persist(nextHabits, nextCompletions) {
    localStorage.setItem(HABITS_KEY, JSON.stringify(nextHabits));
    localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(nextCompletions));
  }

  function handleAddHabit() {
    setError("");
    const name = newName.trim();
    if (!name) {
      setError("習慣の名前を入力してください");
      return;
    }
    const habit = {
      id: `${Date.now()}`,
      name,
      emoji: newEmoji,
      color: COLORS[habits.length % COLORS.length],
      createdAt: todayStr(),
    };
    const nextHabits = [...habits, habit];
    setHabits(nextHabits);
    persist(nextHabits, completions);
    setNewName("");
    setNewEmoji(EMOJIS[0]);
    setShowAdd(false);
  }

  function handleToggleToday(habitId) {
    const today = todayStr();
    const current = completions[habitId] || [];
    const has = current.includes(today);
    const nextList = has ? current.filter((d) => d !== today) : [...current, today];
    const nextCompletions = { ...completions, [habitId]: nextList };
    setCompletions(nextCompletions);
    persist(habits, nextCompletions);
  }

  function handleDelete(habitId) {
    const nextHabits = habits.filter((h) => h.id !== habitId);
    const nextCompletions = { ...completions };
    delete nextCompletions[habitId];
    setHabits(nextHabits);
    setCompletions(nextCompletions);
    persist(nextHabits, nextCompletions);
  }

  const doneTodayCount = habits.filter((h) => (completions[h.id] || []).includes(todayStr())).length;

  return (
    <div style={{
      fontFamily: "Inter, -apple-system, sans-serif", background: "#FFFBF5",
      minHeight: "100vh", color: "#2B2B2B", padding: "calc(env(safe-area-inset-top) + 24px) 16px 48px",
      maxWidth: 420, margin: "0 auto",
    }}>
      <h1 style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 24, margin: "0 0 4px" }}>習慣トラッカー</h1>
      <p style={{ color: "#8A8478", fontSize: 13, margin: "0 0 20px" }}>
        {loading ? "読み込み中..." : habits.length === 0
          ? "続けたい習慣を登録してみましょう"
          : `今日は ${habits.length} 個中 ${doneTodayCount} 個完了`}
      </p>

      {!loading && habits.length > 0 && (
        <div style={{
          background: "linear-gradient(135deg, #FF6B4A, #FFC145)", borderRadius: 16,
          padding: "16px 18px", marginBottom: 18, color: "#fff",
        }}>
          <p style={{ margin: 0, fontSize: 13, fontWeight: 600, opacity: 0.9 }}>今日の達成率</p>
          <p style={{ margin: "4px 0 0", fontSize: 28, fontWeight: 700, fontFamily: "'Baloo 2', sans-serif" }}>
            {Math.round((doneTodayCount / habits.length) * 100)}%
          </p>
        </div>
      )}

      {!loading && habits.map((h) => (
        <HabitCard
          key={h.id}
          habit={h}
          doneDates={completions[h.id] || []}
          onToggleToday={handleToggleToday}
          onDelete={handleDelete}
        />
      ))}

      {!loading && habits.length === 0 && (
        <div style={{ textAlign: "center", padding: "32px 0", color: "#B8B2A8" }}>
          <p style={{ fontSize: 40, margin: 0 }}>🌱</p>
          <p style={{ fontSize: 13, margin: "8px 0 0" }}>まだ習慣が登録されていません</p>
        </div>
      )}

      {showAdd ? (
        <div style={{ background: "#fff", borderRadius: 18, padding: "18px", boxShadow: "0 2px 10px rgba(43,43,43,0.06)", marginTop: 8 }}>
          <p style={{ fontSize: 14, fontWeight: 700, margin: "0 0 12px", fontFamily: "'Baloo 2', sans-serif" }}>新しい習慣を追加</p>
          <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
            {EMOJIS.map((em) => (
              <button
                key={em}
                onClick={() => setNewEmoji(em)}
                style={{
                  fontSize: 20, width: 38, height: 38, borderRadius: 10,
                  border: newEmoji === em ? "2px solid #FF6B4A" : "2px solid #F2EFE9",
                  background: "#fff", cursor: "pointer",
                }}
              >
                {em}
              </button>
            ))}
          </div>
          <input
            type="text"
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            placeholder="例: 読書、ストレッチ"
            style={{
              width: "100%", padding: "10px 12px", borderRadius: 10, border: "1px solid #E8E3DA",
              fontSize: 14, marginBottom: 10, background: "#FFFBF5", color: "#2B2B2B",
            }}
          />
          {error && <p style={{ color: "#E0776B", fontSize: 12, margin: "0 0 10px" }}>{error}</p>}
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => { setShowAdd(false); setError(""); }}
              style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "1px solid #E8E3DA", background: "#fff", color: "#8A8478", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
            >
              キャンセル
            </button>
            <button
              onClick={handleAddHabit}
              style={{ flex: 1, padding: "11px 0", borderRadius: 10, border: "none", background: "#FF6B4A", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "'Baloo 2', sans-serif" }}
            >
              追加する
            </button>
          </div>
        </div>
      ) : (
        <button
          onClick={() => setShowAdd(true)}
          style={{
            width: "100%", padding: "13px 0", borderRadius: 12, border: "2px dashed #E8C4B8",
            background: "transparent", color: "#FF6B4A", fontSize: 14, fontWeight: 700,
            cursor: "pointer", marginTop: 8, fontFamily: "'Baloo 2', sans-serif",
          }}
        >
          + 習慣を追加
        </button>
      )}

      <p style={{ fontSize: 11, color: "#C9C4BC", marginTop: 24, textAlign: "center" }}>データはこの端末(ブラウザ)にのみ保存されます。</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HabitTracker />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
