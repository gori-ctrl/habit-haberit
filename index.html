<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>習慣トラッカー</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0B0B0F" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="習慣トラッカー" />
<link rel="apple-touch-icon" href="./icon-180.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #0B0B0F; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  input[type="text"] { font-family: inherit; }
  ::selection { background: #B4FF39; color: #0B0B0F; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback } = React;
const HABITS_KEY = "habit-list";
const COMPLETIONS_KEY = "habit-completions";
const ACCENT = "#B4FF39";

const CATEGORIES = [
  {
    key: "health",
    label: "健康",
    presets: [
      { name: "運動する", emoji: "🏃" },
      { name: "水を飲む", emoji: "💧" },
      { name: "ストレッチ", emoji: "🧘" },
      { name: "野菜を食べる", emoji: "🥗" },
      { name: "早く寝る", emoji: "🌙" },
    ],
  },
  {
    key: "learning",
    label: "学習",
    presets: [
      { name: "読書", emoji: "📖" },
      { name: "語学学習", emoji: "🎧" },
      { name: "日記を書く", emoji: "✍️" },
      { name: "コーディング", emoji: "💻" },
    ],
  },
  {
    key: "mind",
    label: "マインド",
    presets: [
      { name: "瞑想", emoji: "🧠" },
      { name: "感謝を書く", emoji: "🙏" },
      { name: "スマホ断ち", emoji: "📵" },
    ],
  },
  {
    key: "life",
    label: "生活",
    presets: [
      { name: "掃除", emoji: "🧹" },
      { name: "家計簿をつける", emoji: "💰" },
      { name: "植物の世話", emoji: "🌱" },
    ],
  },
];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function dateStrOffset(offsetDays) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function computeStreak(doneDates) {
  const set = new Set(doneDates);
  let streak = 0;
  let cursor = 0;
  if (!set.has(dateStrOffset(0))) {
    cursor = -1;
  }
  while (set.has(dateStrOffset(cursor))) {
    streak++;
    cursor--;
  }
  return streak;
}

function last7Days() {
  const days = [];
  for (let i = -6; i <= 0; i++) days.push(dateStrOffset(i));
  return days;
}

function HabitCard({ habit, doneDates, onToggleToday, onDelete }) {
  const streak = computeStreak(doneDates);
  const doneSet = new Set(doneDates);
  const doneToday = doneSet.has(todayStr());
  const week = last7Days();
  const weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];

  return (
    <div style={{
      background: "#16161C", borderRadius: 16, padding: "16px 18px",
      marginBottom: 12, border: doneToday ? `1px solid ${ACCENT}` : "1px solid #26262E",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 22 }}>{habit.emoji}</span>
          <div>
            <p style={{ margin: 0, fontSize: 14, fontWeight: 600, color: "#F5F5F7", fontFamily: "'Space Grotesk', sans-serif" }}>{habit.name}</p>
            {streak > 0 && (
              <p style={{ margin: "2px 0 0", fontSize: 11, color: ACCENT, fontWeight: 600 }}>
                {streak}日連続
              </p>
            )}
          </div>
        </div>
        <button
          onClick={() => onDelete(habit.id)}
          aria-label="この習慣を削除"
          style={{ background: "transparent", border: "none", color: "#4E4E58", fontSize: 11, cursor: "pointer", padding: 4 }}
        >
          削除
        </button>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
        {week.map((d) => {
          const isToday = d === todayStr();
          const done = doneSet.has(d);
          const dow = new Date(d + "T00:00:00").getDay();
          return (
            <div key={d} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 9, color: "#4E4E58" }}>{weekdayLabels[dow]}</span>
              <div style={{
                width: 24, height: 24, borderRadius: 7,
                background: done ? ACCENT : "#1E1E26",
                border: isToday ? `1px solid ${ACCENT}` : "1px solid transparent",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 11, color: done ? "#0B0B0F" : "#4E4E58", fontWeight: 700,
              }}>
                {done ? "✓" : ""}
              </div>
            </div>
          );
        })}
      </div>

      <button
        onClick={() => onToggleToday(habit.id)}
        style={{
          width: "100%", padding: "11px 0", borderRadius: 10, border: doneToday ? "1px solid #26262E" : "none",
          background: doneToday ? "transparent" : ACCENT,
          color: doneToday ? "#8B8B95" : "#0B0B0F",
          fontSize: 13, fontWeight: 700, cursor: "pointer",
          fontFamily: "'Space Grotesk', sans-serif",
        }}
      >
        {doneToday ? "完了済み" : "今日のチェックを付ける"}
      </button>
    </div>
  );
}

function AddHabitPanel({ onAdd, onClose }) {
  const [activeCategory, setActiveCategory] = useState(CATEGORIES[0].key);
  const category = CATEGORIES.find((c) => c.key === activeCategory);

  return (
    <div style={{ background: "#16161C", border: "1px solid #26262E", borderRadius: 16, padding: "16px 18px", marginTop: 8 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <p style={{ fontSize: 14, fontWeight: 700, margin: 0, color: "#F5F5F7", fontFamily: "'Space Grotesk', sans-serif" }}>習慣を選ぶ</p>
        <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#8B8B95", fontSize: 13, cursor: "pointer" }}>閉じる</button>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto" }}>
        {CATEGORIES.map((c) => (
          <button
            key={c.key}
            onClick={() => setActiveCategory(c.key)}
            style={{
              flexShrink: 0, fontSize: 12, padding: "6px 14px", borderRadius: 999,
              border: activeCategory === c.key ? `1px solid ${ACCENT}` : "1px solid #26262E",
              background: activeCategory === c.key ? "rgba(180,255,57,0.1)" : "transparent",
              color: activeCategory === c.key ? ACCENT : "#8B8B95",
              fontWeight: 600, cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif",
            }}
          >
            {c.label}
          </button>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {category.presets.map((p) => (
          <button
            key={p.name}
            onClick={() => onAdd(p)}
            style={{
              display: "flex", alignItems: "center", gap: 8, padding: "10px 12px",
              borderRadius: 10, border: "1px solid #26262E", background: "#1E1E26",
              color: "#F5F5F7", fontSize: 12, fontWeight: 500, cursor: "pointer", textAlign: "left",
            }}
          >
            <span style={{ fontSize: 17 }}>{p.emoji}</span>
            <span>{p.name}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function HabitTracker() {
  const [habits, setHabits] = useState([]);
  const [completions, setCompletions] = useState({});
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);

  const load = useCallback(() => {
    setLoading(true);
    try {
      const h = JSON.parse(localStorage.getItem(HABITS_KEY) || "[]");
      const c = JSON.parse(localStorage.getItem(COMPLETIONS_KEY) || "{}");
      setHabits(Array.isArray(h) ? h : []);
      setCompletions(c && typeof c === "object" ? c : {});
    } catch (e) {
      setHabits([]);
      setCompletions({});
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  function persist(nextHabits, nextCompletions) {
    localStorage.setItem(HABITS_KEY, JSON.stringify(nextHabits));
    localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(nextCompletions));
  }

  function handleAddPreset(preset) {
    if (habits.some((h) => h.name === preset.name)) {
      setShowAdd(false);
      return;
    }
    const habit = {
      id: `${Date.now()}`,
      name: preset.name,
      emoji: preset.emoji,
      createdAt: todayStr(),
    };
    const nextHabits = [...habits, habit];
    setHabits(nextHabits);
    persist(nextHabits, completions);
    setShowAdd(false);
  }

  function handleToggleToday(habitId) {
    const today = todayStr();
    const current = completions[habitId] || [];
    const has = current.includes(today);
    const nextList = has ? current.filter((d) => d !== today) : [...current, today];
    const nextCompletions = { ...completions, [habitId]: nextList };
    setCompletions(nextCompletions);
    persist(habits, nextCompletions);
  }

  function handleDelete(habitId) {
    const nextHabits = habits.filter((h) => h.id !== habitId);
    const nextCompletions = { ...completions };
    delete nextCompletions[habitId];
    setHabits(nextHabits);
    setCompletions(nextCompletions);
    persist(nextHabits, nextCompletions);
  }

  const doneTodayCount = habits.filter((h) => (completions[h.id] || []).includes(todayStr())).length;

  return (
    <div style={{
      fontFamily: "Inter, -apple-system, sans-serif", background: "#0B0B0F",
      minHeight: "100vh", color: "#F5F5F7", padding: "calc(env(safe-area-inset-top) + 24px) 16px 48px",
      maxWidth: 420, margin: "0 auto",
    }}>
      <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22, margin: "0 0 4px", letterSpacing: "-0.02em" }}>習慣トラッカー</h1>
      <p style={{ color: "#8B8B95", fontSize: 13, margin: "0 0 20px" }}>
        {loading ? "読み込み中..." : habits.length === 0
          ? "続けたい習慣を選んでみましょう"
          : `今日は ${habits.length} 個中 ${doneTodayCount} 個完了`}
      </p>

      {!loading && habits.length > 0 && (
        <div style={{
          background: "#16161C", border: "1px solid #26262E", borderRadius: 16,
          padding: "16px 18px", marginBottom: 18,
        }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
            <p style={{ margin: 0, fontSize: 12, fontWeight: 600, color: "#8B8B95" }}>今日の達成率</p>
            <p style={{ margin: 0, fontSize: 30, fontWeight: 700, color: ACCENT, fontFamily: "'Space Grotesk', sans-serif" }}>
              {Math.round((doneTodayCount / habits.length) * 100)}%
            </p>
          </div>
          <div style={{ height: 6, background: "#1E1E26", borderRadius: 999, marginTop: 10, overflow: "hidden" }}>
            <div style={{
              height: "100%", width: `${Math.round((doneTodayCount / habits.length) * 100)}%`,
              background: ACCENT, borderRadius: 999, transition: "width 0.4s ease",
            }} />
          </div>
        </div>
      )}

      {!loading && habits.map((h) => (
        <HabitCard
          key={h.id}
          habit={h}
          doneDates={completions[h.id] || []}
          onToggleToday={handleToggleToday}
          onDelete={handleDelete}
        />
      ))}

      {!loading && habits.length === 0 && !showAdd && (
        <div style={{ textAlign: "center", padding: "32px 0", color: "#4E4E58" }}>
          <p style={{ fontSize: 13, margin: 0 }}>まだ習慣が登録されていません</p>
        </div>
      )}

      {showAdd ? (
        <AddHabitPanel onAdd={handleAddPreset} onClose={() => setShowAdd(false)} />
      ) : (
        <button
          onClick={() => setShowAdd(true)}
          style={{
            width: "100%", padding: "13px 0", borderRadius: 12, border: `1px dashed #3A3A44`,
            background: "transparent", color: ACCENT, fontSize: 13, fontWeight: 700,
            cursor: "pointer", marginTop: 8, fontFamily: "'Space Grotesk', sans-serif",
          }}
        >
          + 習慣を追加
        </button>
      )}

      <p style={{ fontSize: 11, color: "#4E4E58", marginTop: 24, textAlign: "center" }}>データはこの端末(ブラウザ)にのみ保存されます。</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HabitTracker />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
